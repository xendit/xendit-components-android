name: Build Demo APKs

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APKs
        run: ./gradlew :exampleApp:assembleDebug :exampleApp:assembleRelease

      - name: Upload APKs to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "demo-build"
          name: "Latest Demo Build"
          body: "Automated debug and release builds from the main branch."
          files: |
            exampleApp/build/outputs/apk/debug/exampleApp-debug.apk
            exampleApp/build/outputs/apk/release/exampleApp-release.apk
          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: true
